name: build-release

# RSXM 自动打包：由 App 内「GitHub 面板」以 workflow_dispatch 触发，
# 或在推送 v* 标签时自动构建并发布 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.24；留空则读 build.gradle）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          echo d56f5187479451eabf01fb78af6dfcb131a6481e >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Build release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Compute version
        id: ver
        working-directory: android-app
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-proot-v${{ steps.ver.outputs.ver }}.apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag push / manual)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="v$VER"
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          # 已存在标签则仅补充/更新资产；否则创建 release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber || true
          else
            gh release create "$TAG" "$APK" \
              --title "v$VER" \
              --notes "Reasonix Proot v$VER" \
              --generate-notes || true
          fi